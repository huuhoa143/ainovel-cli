# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# CHẠY TAY, không có pipeline nào gọi tệp này.
#
# `.github/workflows/` đã bị xóa hết (CI, docker, release) theo yêu cầu: fork này không phát
# hành gì và không đáng tiêu phút GitHub Actions. Actions cũng đã tắt ở cấp repo, nên kể cả
# khi đồng bộ upstream kéo workflow về thì cũng không có gì chạy.
#
# Tệp này GIỮ LẠI vì nó không tốn gì và vẫn dùng được tại chỗ — đây là cách dựng gói có đủ
# nhị phân lẫn giao diện web đã build cho cả bốn nền tảng:
#
#	goreleaser release --snapshot --clean --skip=publish
#
# Cần `goreleaser` và `node` trên máy (xem `before.hooks` bên dưới). Kết quả nằm ở `dist/`.
#
# `.github/scripts/gen-changelog.sh` cũng thành công cụ chạy tay theo cùng lý do đó.
version: 2

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test -count=1 ./...
    # Giao diện web phải được DỰNG ở đây, vì `web/out` không nằm trong git
    # (`web/.gitignore`) và nhị phân không nhúng nó — `internal/serve` đọc thư mục
    # ấy từ đĩa bằng `http.Dir` ở từng lượt yêu cầu.
    #
    # Thiếu hai dòng này thì bản phát hành ship ra KHÔNG có giao diện: người dùng
    # giải nén, chạy, và nhận đúng một dòng "chế độ: chỉ API".
    #
    # `sh -c 'cd web && …'` chứ không `cmd:`/`dir:`: `before.hooks` của goreleaser
    # v2 chỉ nhận CHUỖI, dạng map hai khóa kia chỉ dùng được ở `builds.hooks`. Đã
    # thử và nó chết ngay lúc đọc cấu hình ("cannot unmarshal !!map into string").
    #
    # `cd` chứ không `npm --prefix web`: `--prefix` đổi chỗ cài phụ thuộc, còn thư
    # mục làm việc của script thì tùy phiên bản npm — một chỗ để lệch mà không cần
    # phải có. `cd` thì không có gì để tùy.
    #
    # `npm ci` chứ không `npm install`: nó dựng đúng cây phụ thuộc đã khóa trong
    # `package-lock.json`. `install` được phép nâng phiên bản, tức bản phát hành
    # mang một cây phụ thuộc chưa ai chạy thử.
    - sh -c 'cd web && npm ci'
    - sh -c 'cd web && npm run build'

builds:
  - id: ainovel-cli
    main: ./cmd/ainovel-cli
    binary: ainovel-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: ainovel-cli-archive
    ids:
      - ainovel-cli
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      # Giao diện đã dựng, đặt thành `web/` NGAY CẠNH nhị phân trong gói.
      #
      # `dst: web` chứ không giữ nguyên `web/out`: trong gói không có bản mã nguồn
      # nào để `out` phân biệt với, nên hai tầng thư mục chỉ là dấu vết của cây
      # repo. Người dùng giải nén rồi gõ `--web ./web`, đúng một tầng.
      - src: web/out
        dst: web
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  groups:
    - title: "New Features"
      regexp: '^feat'
    - title: "Bug Fixes"
      regexp: '^fix'
    - title: "Performance"
      regexp: '^perf'
    - title: "Refactor"
      regexp: '^refactor'
    - title: "Others"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"

release:
  github:
    owner: voocel
    name: ainovel-cli
