name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # BẮT BUỘC kể từ khi `before.hooks` của goreleaser dựng giao diện web.
      # Thiếu bước này thì `npm ci` không tìm thấy lệnh và cả lượt phát hành chết
      # ở hook đầu tiên — trước khi có nhị phân nào được dựng.
      #
      # `cache-dependency-path` vì lockfile nằm trong `web/`, không ở gốc repo;
      # `cache: npm` một mình sẽ không tìm thấy nó và bỏ cache trong im lặng.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate release notes
        run: .github/scripts/gen-changelog.sh > release-notes.md
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: >-
            release --clean
            --release-notes=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
